name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  ci-cd:
    name: CI/CD
    permissions:
      contents: read
      packages: write
      deployments: write
    uses: significa/actions/.github/workflows/npm-library.yaml@main
    with:
      lint_command: 'npm run lint'
      test_command: 'npm run test'
      build_command: ''
      node_versions: '[18]'
      # FIXME: For building to work we must provide the requred env var PUBLIC_STORYBLOK_TOKEN
      # 'npm run build'
      publish_to_github_registry: false
      publish_to_npm_registry: false
