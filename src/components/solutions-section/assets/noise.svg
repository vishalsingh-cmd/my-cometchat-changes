<svg
    width="1440"
    height="1121"
    viewBox="0 0 1440 1121"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
>
    <defs>
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="1" seed="3"
                stitchTiles="stitch"
                result="ripples" />
            <feComposite operator="in" in="ripples" in2="SourceGraphic" />
        </filter>
        <radialGradient id="gradient">
            <stop offset="0%" stop-color="black" stop-opacity="1" />
            <stop offset="100%" stop-color="black" stop-opacity="0" />
        </radialGradient>
    </defs>
    <circle cx="720" cy="720" r="720" filter="url(#noiseFilter)" fill="url(#gradient)"
        fill-opacity="0.08" />
</svg>